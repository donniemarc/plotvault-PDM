[package]
name = "tuwendang-client"
version = "0.9.0"
description = "图文档管理客户端"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "tuwendang_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
